<section class="section bg-mist"><div class="container">
  <h1 style="font-size:36px;color:#0f172a">Tu carrito</h1>
  <div id="cart-area" style="margin-top:24px"></div>
  <div style="margin-top:24px"><a href="index.html" class="btn btn-dark">← Seguir comprando</a></div>
</div></section>
<script>
function renderCart(){
  var c=tekGetCart();var a=document.getElementById('cart-area');
  if(!c.length){a.innerHTML='<p style="color:#64748b">Tu carrito está vacío.</p>';return;}
  var rows=c.map(function(i){return '<tr><td><img src="'+i.image+'"></td><td>'+i.name+'</td><td>'+i.quantity+'</td><td>'+tekFormatMXN(i.price*i.quantity)+'</td><td><button class="btn-remove" onclick="tekRemoveFromCart(\''+i.id+'\')">Quitar</button></td></tr>'}).join('');
  var total=c.reduce(function(s,i){return s+i.price*i.quantity},0);
  a.innerHTML='<table class="cart-table"><thead><tr><th></th><th>Producto</th><th>Cant.</th><th>Subtotal</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
  '<div class="totalbar"><div class="t">Total: '+tekFormatMXN(total)+'</div><div><button class="btn btn-dark" onclick="tekClearCart()">Vaciar</button> <button class="btn btn-green" onclick="alert(\'¡Gracias por tu compra!\');tekClearCart()">Pagar</button></div></div>';
}
window.renderCart=renderCart;document.addEventListener('DOMContentLoaded',renderCart);
</script>
